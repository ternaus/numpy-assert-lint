[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "numpy-assert-lint"
version = "0.2.0"
description = "Lint and fix NumPy assertions to prefer diagnostic numpy.testing helpers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vladimir Iglovikov" }]
keywords = ["linting", "numpy", "pre-commit", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "libcst>=1.8.6",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "tomli>=2.0.1",
]

[project.scripts]
numpy-assert-lint = "numpy_assert_lint.cli:main"

[project.urls]
Homepage = "https://github.com/Ternaus/numpy-assert-lint"
Changelog = "https://github.com/Ternaus/numpy-assert-lint/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ternaus/numpy-assert-lint/issues"
Repository = "https://github.com/Ternaus/numpy-assert-lint"

[tool.hatch.build.targets.wheel]
packages = ["src/numpy_assert_lint"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
source = ["numpy_assert_lint"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # The project does not require copyright headers in every file.
    "D203",   # Incompatible with D211.
    "D213",   # Incompatible with D212.
    "ISC001", # Conflicts with the formatter.
]

[tool.ruff.lint.per-file-ignores]
"src/numpy_assert_lint/cli.py" = ["C901", "PLR0912", "PLR0915"]
"src/numpy_assert_lint/fixer.py" = ["N802", "PLR0911"]
"tests/**/*.py" = ["D", "EM101", "INP001", "PLR2004", "S101", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["numpy_assert_lint"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
