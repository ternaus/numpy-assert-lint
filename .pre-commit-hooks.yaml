- id: numpy-assert-lint
  name: numpy-assert-lint
  description: Find NumPy comparisons that lose useful failure diagnostics inside plain assert statements.
  entry: numpy-assert-lint
  language: python
  types: [python]
  stages: [pre-commit, pre-merge-commit, pre-push, manual]

- id: numpy-assert-lint-fix
  name: numpy-assert-lint (fix)
  description: Apply conservative fixes for NumPy assertions that lose useful failure diagnostics.
  entry: numpy-assert-lint --fix
  language: python
  types: [python]
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
